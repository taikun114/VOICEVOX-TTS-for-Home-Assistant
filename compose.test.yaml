name: voicevox-tts-test

services:
  whisper:
    image: rhasspy/wyoming-whisper:latest
    command: ["--model", "small-int8", "--language", "ja"]
    volumes:
      - whisper-data:/data
    stop_grace_period: 60s

  voicevox-engine:
    image: voicevox/voicevox_engine:cpu-0.26.0-dev@sha256:f2ae5ed25770866bfbd0e148623a9e560283ba57e487e825bb62edf16b4eabf7
    ports:
      - "127.0.0.1:50021:50021"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/50021 && printf "GET /version HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && IFS= read -r status <&3 && [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    stop_grace_period: 60s

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    environment:
      TZ: Asia/Tokyo
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      voicevox-engine:
        condition: service_healthy
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./test-config:/config
      - ./dev/homeassistant/configuration.yaml:/config/configuration.yaml:ro
      - ./custom_components/voicevox_tts:/config/custom_components/voicevox_tts:ro
    stop_grace_period: 60s

volumes:
  whisper-data:
